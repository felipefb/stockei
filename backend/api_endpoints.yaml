openapi: 3.1.0
info:
  title: Stockei API
  version: 0.1.0
paths:
  /process-frame:
    post:
      summary: Process Frame
      description: Recebe frame JPEG, processa via fila + YOLOv8, retorna e transmite
        detecções.
      operationId: process_frame_process_frame_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_process_frame_process_frame_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /process-frame/stats:
    get:
      summary: Frame Stats
      operationId: frame_stats_process_frame_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/register:
    post:
      summary: Register
