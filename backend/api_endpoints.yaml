      security:
      - HTTPBearer: []
  /stores/{store_id}:
    get:
      summary: Get Store
      operationId: get_store_stores__store_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: integer
          title: Store Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      summary: Update Store
      operationId: update_store_stores__store_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: integer
          title: Store Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cameras:
    get:
      summary: List Cameras
      operationId: list_cameras_cameras_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CameraOut'
                type: array
                title: Response List Cameras Cameras Get
      security:
      - HTTPBearer: []
    post:
      summary: Create Camera
      operationId: create_camera_cameras_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /cameras/{camera_id}:
    get:
      summary: Get Camera
      operationId: get_camera_cameras__camera_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: integer
          title: Camera Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      summary: Update Camera
      operationId: update_camera_cameras__camera_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: integer
          title: Camera Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /products:
    get:
      summary: List Products
      operationId: list_products_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductOut'
                type: array
                title: Response List Products Products Get
      security:
      - HTTPBearer: []
    post:
      summary: Create Product
      operationId: create_product_products_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /products/{product_id}:
    get:
      summary: Get Product
      operationId: get_product_products__product_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      summary: Update Product
      operationId: update_product_products__product_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          title: Product Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /inventory:
    get:
      summary: List Inventory
      operationId: list_inventory_inventory_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InventoryOut'
                type: array
                title: Response List Inventory Inventory Get
      security:
      - HTTPBearer: []
  /inventory/count:
    post:
      summary: Count Inventory
      operationId: count_inventory_inventory_count_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /inventory/count/{inventory_id}:
    get:
      summary: Get Count
      operationId: get_count_inventory_count__inventory_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: inventory_id
        in: path
        required: true
        schema:
          type: integer
          title: Inventory Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /identify/{ean}:
    get:
      summary: Identify
      description: Identifica produto pelo código de barras (sku=EAN) com estoque
        atual.
      operationId: identify_identify__ean__get
      security:
      - HTTPBearer: []
      parameters:
      - name: ean
        in: path
        required: true
        schema:
          type: string
          title: Ean
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /identify/{ean}/register:
    post:
      summary: Register By Ean
      description: Cadastra produto novo a partir do EAN escaneado, com dados normalizados.
      operationId: register_by_ean_identify__ean__register_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ean
        in: path
        required: true
        schema:
          type: string
          title: Ean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterByEan'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /identify/suggest-from-image:
    post:
      summary: Suggest From Image
      description: Lê a embalagem no frame (OCR local) e sugere a descrição do produto.
      operationId: suggest_from_image_identify_suggest_from_image_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_suggest_from_image_identify_suggest_from_image_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /identify/{ean}/stock-in:
    post:
      summary: Stock In By Ean
      description: Confirma entrada em estoque do produto escaneado.
      operationId: stock_in_by_ean_identify__ean__stock_in_post
      security:
      - HTTPBearer: []
      parameters:
      - name: ean
        in: path
        required: true
        schema:
          type: string
          title: Ean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /inventory/export.csv:
    get:
      summary: Export Inventory Csv
      description: Exporta o inventário em CSV (Excel-friendly, ; como separador).
      operationId: export_inventory_csv_inventory_export_csv_get
      security:
      - HTTPBearer: []
      parameters:
      - name: store_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Store Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /dashboard/summary:
    get:
      summary: Dashboard Summary
      description: 'Resumo executivo do estoque: valor, categorias, alertas e movimentações.'
      operationId: dashboard_summary_dashboard_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: store_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Store Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /movements:
    get:
      summary: List Movements
      operationId: list_movements_movements_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MovementOut'
                type: array
                title: Response List Movements Movements Get
      security:
      - HTTPBearer: []
    post:
      summary: Create Movement
      operationId: create_movement_movements_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    Body_process_frame_process_frame_post:
      properties:
        frame:
          type: string
          format: binary
          title: Frame
      type: object
      required:
      - frame
      title: Body_process_frame_process_frame_post
    Body_suggest_from_image_identify_suggest_from_image_post:
      properties:
        frame:
          type: string
          format: binary
          title: Frame
      type: object
      required:
      - frame
      title: Body_suggest_from_image_identify_suggest_from_image_post
    CameraIn:
      properties:
        store_id:
          type: integer
          title: Store Id
        name:
          type: string
          title: Name
        location:
          type: string
          title: Location
          default: ''
      type: object
      required:
      - store_id
      - name
      title: CameraIn
    CameraOut:
      properties:
        id:
          type: integer
          title: Id
        store_id:
          type: integer
          title: Store Id
        name:
          type: string
          title: Name
        location:
          type: string
          title: Location
        status:
          type: string
          title: Status
        last_seen:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - store_id
      - name
      - location
      - status
      - last_seen
      - created_at
      title: CameraOut
    CountRequest:
      properties:
        product_id:
          type: integer
          title: Product Id
        quantity:
          type: integer
          title: Quantity
      type: object
      required:
      - product_id
      - quantity
      title: CountRequest
    CustomerIn:
      properties:
        name:
          type: string
          title: Name
        cnpj:
          type: string
          title: Cnpj
        email:
          type: string
          format: email
          title: Email
        phone:
          type: string
          title: Phone
          default: ''
        plan:
          type: string
          title: Plan
          default: pilot
      type: object
      required:
      - name
      - cnpj
      - email
      title: CustomerIn
    CustomerOut:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        cnpj:
          type: string
          title: Cnpj
        email:
          type: string
          title: Email
        phone:
          type: string
          title: Phone
        plan:
          type: string
          title: Plan
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - cnpj
      - email
      - phone
      - plan
      - status
      - created_at
      title: CustomerOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InventoryOut:
      properties:
        id:
          type: integer
          title: Id
        product_id:
          type: integer
          title: Product Id
        quantity:
          type: integer
          title: Quantity
        last_count:
          type: integer
          title: Last Count
        last_counted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Counted At
      type: object
      required:
      - id
      - product_id
      - quantity
      - last_count
      - last_counted_at
      title: InventoryOut
    MovementIn:
      properties:
        product_id:
          type: integer
          title: Product Id
        quantity:
          type: integer
          title: Quantity
        type:
          type: string
          pattern: ^(in|out|adjustment)$
          title: Type
      type: object
      required:
      - product_id
      - quantity
      - type
      title: MovementIn
    MovementOut:
      properties:
        id:
          type: integer
          title: Id
        product_id:
          type: integer
          title: Product Id
        quantity:
          type: integer
          title: Quantity
        type:
          type: string
          title: Type
