<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stockei</title>
  <link rel="stylesheet" href="../frontend/camera_styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stockei">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    .layout { max-width: 560px; margin: 0 auto; padding: 1.4rem 1.2rem calc(2rem + env(safe-area-inset-bottom)); }
    header { text-align: center; margin: 0.5rem 0 1.4rem; }
    .who { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem;
    }
    .module {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.6rem; min-height: 128px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none; color: var(--text);
      font-family: var(--font-display); font-weight: 700; font-size: 0.92rem;
      transition: transform 0.12s ease, border-color 0.12s ease;
      text-align: center; padding: 1rem 0.6rem;
    }
    .module:active { transform: scale(0.97); }
    .module .icon {
      font-size: 1.7rem; width: 54px; height: 54px;
      display: grid; place-items: center; border-radius: 14px;
      background: var(--lime-dim); border: 1px solid rgba(198, 255, 62, 0.3);
    }
    .module.soon { opacity: 0.45; pointer-events: none; }
    .module.soon .icon { background: var(--surface-2); border-color: var(--border); }
    .module .soon-tag {
      position: absolute; top: 10px; right: 10px;
      font-family: var(--font-mono); font-size: 0.55rem; font-weight: 700;
      letter-spacing: 0.1em; color: var(--faint);
      border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px;
    }
    .badge-alert {
      position: absolute; top: 10px; right: 10px;
      background: var(--danger); color: #fff;
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 700;
      min-width: 22px; height: 22px; border-radius: 999px;
      display: grid; place-items: center; padding: 0 6px;
    }
    #login-hint { text-align: center; margin-top: 1.4rem; }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <span class="klabel">Inventário por câmera</span><br>
      <span class="brand" style="font-size:1.7rem">STOCKEI</span>
      <div class="who" id="who">—</div>
    </header>

    <div class="grid">
      <a class="module" href="demo_portal.html">
        <span class="icon">📷</span> Estação de contagem
      </a>
      <a class="module" href="dashboard.html" id="mod-dash">
        <span class="icon">📊</span> Dashboard
        <span class="badge-alert" id="badge-exp" hidden></span>
      </a>
      <a class="module" href="inventory.html">
        <span class="icon">📦</span> Inventário
      </a>
      <a class="module" href="#" onclick="exportCsv();return false">
        <span class="icon">⬇️</span> Exportar CSV
      </a>
      <a class="module soon" href="#"><span class="soon-tag">EM BREVE</span>
        <span class="icon">🧾</span> Conferência
      </a>
      <a class="module soon" href="#"><span class="soon-tag">EM BREVE</span>
        <span class="icon">📉</span> Perdas
      </a>
      <a class="module soon" href="#"><span class="soon-tag">EM BREVE</span>
        <span class="icon">🔁</span> Transferências
      </a>
      <a class="module soon" href="#"><span class="soon-tag">EM BREVE</span>
        <span class="icon">⚙️</span> Configurações
      </a>
    </div>

    <p class="hint" id="login-hint" hidden>
      Você não está conectado — os módulos abrem a tela de login.
    </p>
  </div>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

    const token = sessionStorage.getItem("token");
    async function boot() {
      if (!token) {
        document.getElementById("login-hint").hidden = false;
        document.getElementById("who").textContent = "toque em um módulo para entrar";
        return;
      }
      try {
        const h = { Authorization: `Bearer ${token}` };
        const meResp = await fetch("/users/me", { headers: h });
        if (!meResp.ok) throw new Error("sessão expirada");
        const me = await meResp.json();
        document.getElementById("who").textContent = `Usuário: ${me.name}`;
        const d = await (await fetch("/dashboard/summary", { headers: h })).json();
        const pend = (d.expiring || []).length + (d.low_stock || []).length;
        if (pend > 0) {
          const b = document.getElementById("badge-exp");
          b.textContent = pend;
          b.hidden = false;
        }
      } catch (e) {
        document.getElementById("login-hint").hidden = false;
        document.getElementById("who").textContent = "sessão expirada — entre de novo";
      }
    }
    boot();

    async function exportCsv() {
      if (!token) { location.href = "demo_portal.html"; return; }
      const r = await fetch("/inventory/export.csv", { headers: { Authorization: `Bearer ${token}` } });
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `stockei_inventario_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
